<div class="app-shell relative isolate flex min-h-screen overflow-x-clip">
  <div class="relative z-[1] flex min-h-screen w-full flex-col">
    @if (auth.user()) {
      <header class="glass-chrome sticky top-0 z-40 w-full border-b border-[rgba(255,255,255,0.55)]">
        <div class="mx-auto flex min-h-[82px] w-full items-center gap-5 px-8 max-[1200px]:gap-3 max-[960px]:min-h-[72px] max-[760px]:gap-3 max-[760px]:px-4">
          <a [href]="reactPage('/dashboard')" aria-label="Go to dashboard" class="flex h-[58px] w-[165px] flex-none items-center justify-start rounded-lg transition-opacity hover:opacity-85 max-[1200px]:w-[135px] max-[760px]:h-[48px] max-[760px]:w-[80px]">
            <img src="/wincapture-logo.png" alt="Project logo" class="block max-h-[52px] max-w-full object-contain object-left max-[760px]:max-h-[44px]" />
          </a>

          <nav aria-label="Primary navigation" class="flex min-w-0 flex-1 items-center justify-center gap-1 max-[1000px]:hidden">
            <a [href]="reactPage('/dashboard')" class="layout-nav-link"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10Z" /></svg><span>Dashboard</span></a>
            <a routerLink="/albums" routerLinkActive="layout-nav-active" [routerLinkActiveOptions]="{exact: true}" aria-current="page" class="layout-nav-link"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="3" /><circle cx="8.5" cy="8.5" r="1.5" /><path d="m21 15-5-5L5 21" /></svg><span>Albums</span></a>
            <a [href]="reactPage('/files')" class="layout-nav-link"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="M4 4h6l2 3h8a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z" /><path d="M3 10h18" /></svg><span>Files</span></a>
          </nav>

          <button type="button" class="layout-mobile-toggle hidden h-11 w-11 flex-none items-center justify-center rounded-xl border border-[rgba(255,255,255,0.65)] bg-white/45 text-[#3b5973] backdrop-blur-md transition-colors hover:bg-white/70 hover:text-[#126dd7] max-[1000px]:inline-flex" (click)="toggleMobileNavigation()" [attr.aria-label]="mobileOpen() ? 'Close navigation' : 'Open navigation'" [attr.aria-expanded]="mobileOpen()" aria-controls="mobile-primary-navigation">
            @if (mobileOpen()) {
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="m18 6-12 12M6 6l12 12" /></svg>
            } @else {
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
            }
          </button>

          <div #profileContainer class="relative ml-auto flex flex-none items-center border-l border-[rgba(189,211,229,0.45)] pl-5 max-[1200px]:pl-3 max-[760px]:border-l-0 max-[760px]:pl-0">
            <button #profileTrigger type="button" class="inline-flex min-w-0 items-center gap-3 rounded-xl border border-transparent p-1 text-left transition-colors hover:border-[rgba(255,255,255,0.55)] hover:bg-[rgba(255,255,255,0.45)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#3787d4] max-[1200px]:gap-2" (click)="toggleProfileMenu()" [attr.aria-label]="'Profile menu for ' + (auth.user()?.name ?? 'WinCapture User')" aria-haspopup="menu" [attr.aria-expanded]="profileOpen()">
              <span class="grid h-10 w-10 flex-none place-items-center rounded-full bg-[linear-gradient(135deg,#54a6ff,#1b6ecf)] text-[12px] font-bold text-white shadow-[0_4px_12px_rgba(27,110,207,0.22),inset_0_1px_1px_rgba(255,255,255,0.4)]" aria-hidden="true">{{ initials(auth.user()?.name) }}</span>
              <span class="grid min-w-0 gap-1 max-[760px]:hidden"><strong class="max-w-[180px] overflow-hidden text-ellipsis whitespace-nowrap text-[12px] font-semibold text-[#183955]">{{ auth.user()?.name }}</strong><span class="text-[10px] font-medium text-[#658299]">{{ auth.user()?.role }}</span></span>
            </button>
            @if (profileOpen()) {
              <div role="menu" aria-label="Profile options" class="glass-popover absolute right-0 top-full z-[60] mt-2 min-w-[150px] rounded-xl p-1.5">
                <button type="button" role="menuitem" class="danger-gradient-action flex min-h-[34px] w-full items-center justify-center gap-1.5 rounded-[8px] px-2.5 text-[11px] font-semibold" (click)="profileOpen.set(false); auth.signOut()">
                  <svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" /></svg>Sign out
                </button>
              </div>
            }
          </div>
        </div>

        @if (mobileOpen()) {
          <nav id="mobile-primary-navigation" aria-label="Mobile navigation" class="border-t border-[rgba(255,255,255,0.55)] bg-[rgba(255,255,255,0.72)] px-4 py-3 backdrop-blur-2xl min-[1001px]:hidden">
            <div class="mx-auto flex w-full max-w-7xl flex-col gap-1">
              <a [href]="reactPage('/dashboard')" class="layout-nav-link layout-nav-mobile" (click)="closeMobileNavigation()"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10Z" /></svg><span>Dashboard</span></a>
              <a routerLink="/albums" routerLinkActive="layout-nav-active" [routerLinkActiveOptions]="{exact:true}" class="layout-nav-link layout-nav-mobile" (click)="closeMobileNavigation()"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="3" /><circle cx="8.5" cy="8.5" r="1.5" /><path d="m21 15-5-5L5 21" /></svg><span>Albums</span></a>
              <a [href]="reactPage('/files')" class="layout-nav-link layout-nav-mobile" (click)="closeMobileNavigation()"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="M4 4h6l2 3h8a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z" /><path d="M3 10h18" /></svg><span>Files</span></a>
            </div>
          </nav>
        }
      </header>
    }

    <main class="app-main min-w-0 w-full flex-1">
      <router-outlet />
    </main>
  </div>
</div>
